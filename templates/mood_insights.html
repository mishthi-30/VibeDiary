<script>

    const moodLabels = {{ mood_counts.keys() | list | tojson }};
    const moodData = {{ mood_counts.values() | list | tojson }};

    const isDarkMode = document.body.classList.contains("dark-mode");

    const textColor = isDarkMode ? "#f5f0ff" : "#40394a";
    const gridColor = isDarkMode
        ? "rgba(255,255,255,0.12)"
        : "rgba(103,78,145,0.12)";

    new Chart(document.getElementById("moodChart"), {

        type: "bar",

        data: {

            labels: moodLabels,

            datasets: [{

                label: "Number of Entries",

                data: moodData,

                backgroundColor: [
                    "#8b6fc9",
                    "#d84fa0",
                    "#9b7ed8",
                    "#c48ad8",
                    "#7656b5",
                    "#b86ca8"
                ],

                borderColor: "#8b6fc9",

                borderWidth: 1,

                borderRadius: 8

            }]

        },

        options: {

            responsive: true,

            plugins: {

                legend: {

                    display: true,

                    labels: {

                        color: textColor,

                        font: {
                            family: "DM Sans"
                        }

                    }

                }

            },

            scales: {

                x: {

                    ticks: {
                        color: textColor
                    },

                    grid: {
                        color: gridColor
                    }

                },

                y: {

                    beginAtZero: true,

                    ticks: {

                        stepSize: 1,

                        color: textColor

                    },

                    grid: {
                        color: gridColor
                    }

                }

            }

        }

    });

</script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

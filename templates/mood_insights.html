<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mood Insights | VibeDiary</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="diary-container">

        <h1>📊 Mood Insights</h1>

        <p>See patterns in your diary moods.</p>

        {% if mood_counts %}

            <div style="max-width: 700px; margin: 40px auto;">
                <canvas id="moodChart"></canvas>
            </div>

        {% else %}

            <div class="card">
                <h2>🌸 No Mood Data Yet</h2>
                <p>
                    Write some diary entries and record how you're feeling
                    to see your mood insights here.
                </p>
            </div>

        {% endif %}

        <br>

        <a href="{{ url_for('dashboard') }}">
            ← Back to Dashboard
        </a>

    </div>


    {% if mood_counts %}

    <script>

        const moodLabels = {{ mood_counts.keys() | list | tojson }};
        const moodData = {{ mood_counts.values() | list | tojson }};

        const isDarkMode =
            document.body.classList.contains("dark-mode");

        const textColor =
            isDarkMode ? "#f5f0ff" : "#40394a";

        const gridColor =
            isDarkMode
                ? "rgba(255,255,255,0.12)"
                : "rgba(103,78,145,0.12)";


        new Chart(document.getElementById("moodChart"), {

            type: "bar",

            data: {

                labels: moodLabels,

                datasets: [{

                    label: "Number of Entries",

                    data: moodData,

                    backgroundColor: [
                        "#8b6fc9",
                        "#d84fa0",
                        "#9b7ed8",
                        "#c48ad8",
                        "#7656b5",
                        "#b86ca8"
                    ],

                    borderColor: "#8b6fc9",

                    borderWidth: 1,

                    borderRadius: 8

                }]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {

                        display: true,

                        labels: {

                            color: textColor,

                            font: {
                                family: "DM Sans"
                            }

                        }

                    }

                },

                scales: {

                    x: {

                        ticks: {
                            color: textColor
                        },

                        grid: {
                            color: gridColor
                        }

                    },

                    y: {

                        beginAtZero: true,

                        ticks: {

                            stepSize: 1,

                            color: textColor

                        },

                        grid: {
                            color: gridColor
                        }

                    }

                }

            }

        });

    </script>

    {% endif %}


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
